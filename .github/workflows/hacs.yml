name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # While the repository is private the action cannot read file contents: it reports an
          # invalid hacs.json and no README images (see hacs/integration#5497), although both are
          # fine (README.md embeds six screenshots). Remove this line when going public.
          ignore: hacsjson images
